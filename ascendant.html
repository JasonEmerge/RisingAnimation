<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f16;
    --gold:#c9a15e;
    --gold-dim:#8f7343;
    --champagne:#e9d7ae;
    --ivory:#ddd3c2;
    --hairline:rgba(201,161,94,.28);
    --nav-h:64px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ivory);font-family:'EB Garamond',Georgia,serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none}
  body.locked{overflow:hidden;height:100dvh}

  /* ---------- demo pricing screen (order choice, precedes payment) ---------- */
  #pricing{position:fixed;inset:0;z-index:62;background:#05070c;display:none;
    overflow-y:auto;-webkit-overflow-scrolling:touch}
  #pricing.on{display:block}
  #pricing .pwrap{position:relative;width:100%}
  #pricing img{width:100%;display:block}
  #pricing .hot{position:absolute;left:37.5%;top:58.4%;width:27%;height:5%;
    background:transparent;border:0;cursor:pointer}
  #pricing .hot::after{content:"";position:absolute;inset:-6px;border:1px solid rgba(201,161,94,.55);
    border-radius:10px;animation:breathe 2.4s ease-in-out infinite}

  /* ---------- demo dashboard shell (removed in production integration) ---------- */
  #shell{position:fixed;inset:0;z-index:60;background:#000;display:none;overflow:hidden}
  #shell.on{display:block}
  #shell img{width:100%;height:100%;object-fit:contain;display:block}
  #shell .hint{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));
    text-align:center;font-size:12px;letter-spacing:.28em;color:var(--gold);opacity:.65;
    text-transform:uppercase;animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:.8}}

  /* ---------- transition + black beat ---------- */
  #transit{position:fixed;inset:0;z-index:55;background:#000;display:none;
    transition:opacity .4s ease}
  #transit.fading{opacity:0}
  #transit.on{display:block}
  #transit video{width:100%;height:100%;object-fit:cover;display:block}
  #veil{position:fixed;inset:0;z-index:54;background:#000;opacity:0;pointer-events:none;
    transition:opacity .7s ease}
  #veil.on{opacity:1;pointer-events:auto}

  /* ---------- hero (sign animation) ---------- */
  #hero{position:fixed;top:0;left:0;right:0;height:100dvh;z-index:20;background:#000;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    will-change:height;transition:none}
  #hero.settling{transition:height 1.4s cubic-bezier(.22,.61,.21,1)}
  #heroScale{width:100%;height:100%;transform-origin:center 46%;will-change:transform}
  #hero video{width:100%;height:100%;object-fit:contain;display:block;opacity:0;
    transition:opacity .9s ease}
  #hero.playing video{opacity:1}
  #hero.bloom #heroScale{transform:scale(.06)}
  #hero.bloom.grown #heroScale{animation:bloomGrow 3s linear forwards}
  @keyframes bloomGrow{from{transform:scale(.06)}to{transform:scale(1)}}

  /* ---------- rising content panel ---------- */
  #content{position:fixed;top:0;left:0;right:0;z-index:19;background:var(--bg);
    transform:translateY(100dvh);will-change:transform;visibility:hidden}
  #content.rising{visibility:visible;transition:transform 1.4s cubic-bezier(.22,.61,.21,1)}
  body.done #hero{position:static;height:var(--settled-h)}
  body.done #content{position:static;transform:none;visibility:visible;transition:none}

  .wrap{max-width:640px;margin:0 auto;padding:34px 24px calc(var(--nav-h) + env(safe-area-inset-bottom) + 72px)}

  .eyebrow{display:flex;align-items:center;gap:14px;justify-content:center;
    color:var(--champagne);font-size:18px;letter-spacing:.38em;text-transform:uppercase;
    font-family:'Cormorant Garamond',serif;font-weight:600;padding-left:.38em}
  .eyebrow::before,.eyebrow::after{content:"";flex:0 0 44px;height:1px;
    background:linear-gradient(90deg,transparent,var(--hairline));}
  .eyebrow::after{background:linear-gradient(90deg,var(--hairline),transparent)}
  .eyebrow .dot{font-size:9px;color:var(--gold);letter-spacing:0;padding:0}

  h1{font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--champagne);
    text-align:center;font-size:44px;line-height:1.05;letter-spacing:.10em;
    margin:10px 0 4px;padding-left:.10em;text-shadow:0 0 26px rgba(233,215,174,.18)}
  .subtitle{display:flex;align-items:center;justify-content:center;gap:10px;
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
    color:var(--champagne);font-size:23px}
  .subtitle .orn{color:var(--gold);font-style:normal;font-size:.62em;transform:translateY(1px)}
  .head-rule{width:min(320px,72%);margin:20px auto 0;height:12px;position:relative}
  .head-rule::before{content:"";position:absolute;left:0;right:0;top:5px;height:1px;
    background:linear-gradient(90deg,transparent,var(--hairline) 18%,var(--hairline) 82%,transparent)}
  .head-rule::after{content:"◆";position:absolute;left:50%;top:0;transform:translateX(-50%);
    color:var(--gold);font-size:9px;background:var(--bg);padding:0 8px;line-height:12px}

  section{margin-top:42px}
  h2{font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--gold);
    font-size:26px;line-height:1.25;letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px}
  .reading-copy p{font-size:22px;line-height:1.65;color:var(--ivory);margin-bottom:18px;
    text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .reading-copy p:last-child{margin-bottom:0}
  .divider{margin:40px auto 0;width:100%;height:12px;position:relative}
  .divider::before{content:"";position:absolute;left:0;right:0;top:5px;height:1px;
    background:linear-gradient(90deg,transparent,var(--hairline) 20%,var(--hairline) 80%,transparent)}
  .divider::after{content:"◆";position:absolute;left:50%;top:0;transform:translateX(-50%);
    color:var(--gold);font-size:9px;background:var(--bg);padding:0 8px;line-height:12px}

  /* ---------- bottom navigation ---------- */
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:rgba(8,11,17,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid rgba(201,161,94,.18);display:flex;opacity:0;pointer-events:none;
    transition:opacity .8s ease}
  body.done #nav{opacity:1;pointer-events:auto}
  #nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;text-decoration:none;color:#8b8272;font-size:10.5px;letter-spacing:.06em;
    font-family:'EB Garamond',serif}
  #nav a svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.4;
    stroke-linecap:round;stroke-linejoin:round}
  #nav a.active{color:var(--gold)}

  #stamp{position:fixed;right:8px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 6px);
    z-index:41;font-size:9px;letter-spacing:.08em;color:rgba(201,161,94,.34);
    font-family:'EB Garamond',serif;pointer-events:none}

  @media (prefers-reduced-motion: reduce){
    #hero.settling{transition:none}
    #content.rising{transition:none}
    #shell .hint{animation:none}
  }
</style>
</head>

     4. demo shell fallback (cancer)

     ascendant.html                → demo dashboard shell → transition → sequence
     ascendant.html?asc=leo        → transition video → sequence (hosted testing)

      "Your Dharma is to bring what you imagine into real life.",
      "With Jupiter ruling your chart, you are guided by faith and a strong inner sense of right and wrong. Life will keep placing you where someone needs compassion, and asking you to give it without losing yourself.",
      "The lesson of Pisces Lagna is simple: your sensitivity is a gift, not a flaw. Ground it, and everything that moves through you, imagination, intuition, care, becomes something real that others can feel."
    ]
  }
};

/* ---------- resolve the calculated Ascendant ---------- */
const qs = new URLSearchParams(location.search);
function resolveSign(){
  const cands = [qs.get('asc'), window.EMERGE_ASCENDANT, localStorage.getItem('emergeAscendant')];
  for (const c of cands){
    if (c && SIGNS[String(c).toLowerCase().trim()]) return String(c).toLowerCase().trim();
  }
  return null;
}
const resolved = resolveSign();
const sign = resolved || 'cancer';
const S = SIGNS[sign];

/* ---------- populate template ---------- */
document.getElementById('signTitle').textContent = S.title;
function fillSection(id, paragraphs){
  const el = document.getElementById(id);
  el.innerHTML = '';
  paragraphs.forEach(t => { const p = document.createElement('p'); p.textContent = t; el.appendChild(p); });
}
fillSection('secSidereal', SHARED.sidereal);
fillSection('secEssence', S.essence);
fillSection('secDharma', S.dharma);

/* ---------- elements ---------- */
const shell   = document.getElementById('shell');
const transit = document.getElementById('transit');
const tVid    = document.getElementById('transitVid');
const veil    = document.getElementById('veil');
const hero    = document.getElementById('hero');
const sVid    = document.getElementById('signVid');
const content = document.getElementById('content');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const directMode = qs.get('direct') === '1';
const hasParamAsc = !!qs.get('asc');
const settledMode = qs.get('settled') === '1';   // QA shortcut: final page instantly
const fromPage = qs.get('from');                 // picks the page-turn clip per origin page
tVid.src = fromPage ? 'transition-' + fromPage + '.mp4' : 'transition.mp4';

/* ---------- flow ---------- */
function start(){
  sVid.src = sign + '.mp4';
  if (S.loop) sVid.loop = true;
  sVid.load();

  if (settledMode){
    hero.classList.add('playing');
    const jump = once(() => { settled = false; settle(); });
    sVid.addEventListener('loadedmetadata', jump);
    if (sVid.readyState >= 1) jump();
    setTimeout(jump, 2500);
    sVid.play().catch(()=>{});
    return;
  }

  if (hasParamAsc && directMode){
    blackBeatThenPlay(300);
  } else if (hasParamAsc && qs.get('flow') !== 'full'){
    playTransition();
  } else {
    // full funnel demo: pricing (choose order) → [payment skipped] →
    // Sidereal dashboard → tap → page-turn → sequence
    const pricing = document.getElementById('pricing');
    pricing.classList.add('on');
    document.getElementById('buySidereal').addEventListener('click', () => {
      pricing.classList.remove('on');
      shell.classList.add('on');
    }, { once:true });
    shell.addEventListener('pointerdown', () => {   // EMERGE_SOUND hook: reveal tap
      shell.classList.remove('on');
      playTransition();
    }, { once:true });
  }
}

function playTransition(){
  transit.classList.add('on');
  const fallback = once(() => { transit.classList.remove('on'); blackBeatThenPlay(300); });
  tVid.addEventListener('error', fallback);

  // 2s turn -> freeze ON the center light -> hold -> birth as the 3rd second turns
  const onTU = () => {
    const d = (tVid.duration && isFinite(tVid.duration)) ? tVid.duration : 2;
    if (tVid.currentTime >= d * 0.76){
      tVid.removeEventListener('timeupdate', onTU);
      tVid.pause();                                  // frame locks on the flash
      playSign(true);                                // and the sign is born NOW, already moving
      transit.classList.add('fading');
      setTimeout(() => { transit.classList.remove('on'); transit.classList.remove('fading'); }, 500);
    }
  };
  tVid.addEventListener('timeupdate', onTU);
  tVid.play().catch(fallback);
  setTimeout(() => { if (!hero.classList.contains('playing')) fallback(); }, 9000);
}

function blackBeatThenPlay(ms){
  veil.classList.add('on');
  setTimeout(() => {
    playSign();
    setTimeout(() => veil.classList.remove('on'), 150);
  }, ms);
}

function playSign(bloom){
  if (bloom){
    hero.classList.add('bloom');
    void sVid.offsetWidth;                           // commit scale .06 before growing
    requestAnimationFrame(() => {
      hero.classList.add('playing');
      hero.classList.add('grown');                   // now .06 -> 1 actually animates
    });
  } else {
    hero.classList.add('playing');
  }
  const arm = once(scheduleSettle);
  sVid.addEventListener('loadedmetadata', arm);
  if (sVid.readyState >= 1) arm();
  sVid.addEventListener('error', () => settle());    // missing/broken clip: settle over black
  sVid.play().catch(() => settle());                 // playback blocked: settle immediately
  setTimeout(() => { if (!settled) settle(); }, 9000);  // emergency watchdog
}

let settled = false;
function scheduleSettle(){
  const dur = (sVid.duration && isFinite(sVid.duration)) ? sVid.duration : 5;
  if (S.loop){
    // looping clips keep looping under the risen page; settle after one pass
    setTimeout(settle, Math.max(1000, dur * 1000));
  } else {
    sVid.addEventListener('ended', settle, { once:true }); // backup if timeupdate lags
    // the page begins rising while the final pose is still completing — seamless
    sVid.addEventListener('timeupdate', function te(){
      if (sVid.currentTime >= dur - 1.0){
        sVid.removeEventListener('timeupdate', te);
        settle();
      }
    });
    setTimeout(() => { if (!settled) settle(); }, dur * 1000 + 1500);
  }
}

function settle(){
  if (settled) return;
  settled = true;

  const vw = document.documentElement.clientWidth;
  const ar = (sVid.videoWidth && sVid.videoHeight) ? sVid.videoWidth / sVid.videoHeight : 1.25;
  const settledH = Math.round(vw / ar);
  document.documentElement.style.setProperty('--settled-h', settledH + 'px');

  const finish = once(() => {
    document.body.classList.add('done');             // static flow, scroll unlocked
    document.body.classList.remove('locked');
    hero.classList.remove('settling');
    content.classList.remove('rising');
    hero.style.height = ''; content.style.transform = '';
    window.dispatchEvent(new CustomEvent('EMERGE_ASCENDANT_SETTLED', { detail:{ sign } }));
    if (window.parent !== window)
      window.parent.postMessage({ type:'EMERGE_ASCENDANT_SETTLED', sign }, '*');
  });

  if (reduced){ finish(); return; }

  // no pause: the rise flows straight out of the animation's final moment
  {
    // then one slow glide: the animation moves up as the page rises beneath it
    content.style.transform = 'translateY(' + window.innerHeight + 'px)';
    content.classList.add('rising');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      hero.classList.add('settling');
      hero.style.height = settledH + 'px';
      content.style.transform = 'translateY(' + settledH + 'px)';
      // EMERGE_SOUND hook: page-rise cue
    }));
    content.addEventListener('transitionend', finish, { once:true });
    setTimeout(finish, 3000);                        // safety
  }
}

function once(fn){ let ran=false; return () => { if(!ran){ ran=true; fn(); } }; }

start();
</script>
</body>
</html>
